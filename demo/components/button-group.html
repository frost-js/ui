<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Button Groups</title>
    <link rel="stylesheet" href="../../dist/frost-ui.css" />
    <link rel="stylesheet" href="../assets/demo.css" />
    <script src="../../dist/frost-ui-bundle.js"></script>
    <script src="../assets/demo.js"></script>
</head>

<body>
    <div class="container">
        <h1>Button Groups</h1>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple" type="button">Button 1</button>
                <button class="btn btn-secondary ripple" type="button">Button 2</button>
                <button class="btn btn-secondary ripple" type="button">Button 3</button>
            </div>
        </div>

        <h4>Active</h4>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple active" type="button">Button 1</button>
                <button class="btn btn-secondary ripple" type="button">Button 2</button>
                <button class="btn btn-secondary ripple" type="button">Button 3</button>
            </div>
        </div>

        <h4>Mixed Styles</h4>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <button class="btn btn-danger ripple" type="button">Button 1</button>
                <button class="btn btn-warning ripple" type="button">Button 2</button>
                <button class="btn btn-success ripple" type="button">Button 3</button>
            </div>
        </div>

        <h4>Outline</h4>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <button class="btn btn-outline-secondary ripple" type="button">Button 1</button>
                <button class="btn btn-outline-secondary ripple" type="button">Button 2</button>
                <button class="btn btn-outline-secondary ripple" type="button">Button 3</button>
            </div>
        </div>

        <h4>Checkboxes &amp; Radios</h4>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <input class="btn-check" id="button-check-1" type="checkbox" />
                <label class="btn btn-outline-secondary" for="button-check-1" role="button">Checkbox 1</label>

                <input class="btn-check" id="button-check-2" type="checkbox" />
                <label class="btn btn-outline-secondary" for="button-check-2" role="button">Checkbox 2</label>

                <input class="btn-check" id="button-check-3" type="checkbox" />
                <label class="btn btn-outline-secondary" for="button-check-3" role="button">Checkbox 3</label>
            </div>
        </div>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <input class="btn-check" id="button-radio-1" name="buttonRadio" type="radio" checked />
                <label class="btn btn-outline-secondary" for="button-radio-1" role="button">Radio 1</label>

                <input class="btn-check" id="button-radio-2" name="buttonRadio" type="radio" />
                <label class="btn btn-outline-secondary" for="button-radio-2" role="button">Radio 2</label>

                <input class="btn-check" id="button-radio-3" name="buttonRadio" type="radio" />
                <label class="btn btn-outline-secondary" for="button-radio-3" role="button">Radio 3</label>
            </div>
        </div>

        <h4>Toolbar</h4>
        <div class="mb-4">
            <div class="btn-toolbar" aria-label="Toolbar">
                <div class="btn-group me-2 mb-1" aria-label="Button Group">
                    <button class="btn btn-primary ripple" type="button">1</button>
                    <button class="btn btn-primary ripple" type="button">2</button>
                    <button class="btn btn-primary ripple" type="button">3</button>
                    <button class="btn btn-primary ripple" type="button">4</button>
                </div>
                <div class="btn-group me-2 mb-1" aria-label="Button Group">
                    <button class="btn btn-secondary ripple" type="button">5</button>
                    <button class="btn btn-secondary ripple" type="button">6</button>
                    <button class="btn btn-secondary ripple" type="button">7</button>
                </div>
                <div class="btn-group mb-1" aria-label="Button Group">
                    <button class="btn btn-info ripple" type="button">8</button>
                </div>
            </div>
        </div>

        <h4>Sizes</h4>
        <div class="mb-4">
            <div class="btn-group btn-group-lg mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple" type="button">Button 1</button>
                <button class="btn btn-secondary ripple" type="button">Button 2</button>
                <button class="btn btn-secondary ripple" type="button">Button 3</button>
            </div>
        </div>
        <div class="mb-4">
            <div class="btn-group btn-group-sm mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple" type="button">Button 1</button>
                <button class="btn btn-secondary ripple" type="button">Button 2</button>
                <button class="btn btn-secondary ripple" type="button">Button 3</button>
            </div>
        </div>

        <h4>Nesting</h4>
        <div class="mb-4">
            <div class="btn-group mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple" type="button">Button</button>
                <button class="btn btn-secondary ripple" type="button">Button</button>
                <div class="btn-group mb-0" aria-label="Button Group">
                    <button class="btn btn-secondary ripple dropdown-toggle" id="nested-dropdown" data-ui-toggle="dropdown" type="button" aria-haspopup="true" aria-expanded="false">Dropdown</button>
                    <div class="dropdown-menu" aria-labelledby="nested-dropdown">
                        <button class="dropdown-item" type="button">Action</button>
                        <button class="dropdown-item" type="button">Action</button>
                        <button class="dropdown-item" type="button">Action</button>
                    </div>
                </div>
            </div>
        </div>

        <h4>Vertical</h4>
        <div class="mb-4">
            <div class="btn-group-vertical mb-0" aria-label="Button Group">
                <button class="btn btn-secondary ripple" type="button">Button</button>
                <button class="btn btn-secondary ripple" type="button">Button</button>
                <div class="btn-group mb-0" aria-label="Button Group">
                    <button class="btn btn-secondary ripple dropdown-toggle" id="vertical-dropdown" data-ui-toggle="dropdown" type="button" aria-haspopup="true" aria-expanded="false">Dropdown</button>
                    <div class="dropdown-menu" aria-labelledby="vertical-dropdown">
                        <button class="dropdown-item" type="button">Action</button>
                        <button class="dropdown-item" type="button">Action</button>
                        <button class="dropdown-item" type="button">Action</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <div class="btn-group-vertical mb-0" aria-label="Button Group">
                <input class="btn-check" id="button-vertical-radio-1" name="buttonVerticalRadio" type="radio" checked />
                <label class="btn btn-outline-danger" for="button-vertical-radio-1" role="button">Radio 1</label>

                <input class="btn-check" id="button-vertical-radio-2" name="buttonVerticalRadio" type="radio" />
                <label class="btn btn-outline-danger" for="button-vertical-radio-2" role="button">Radio 2</label>

                <input class="btn-check" id="button-vertical-radio-3" name="buttonVerticalRadio" type="radio" />
                <label class="btn btn-outline-danger" for="button-vertical-radio-3" role="button">Radio 3</label>
            </div>
        </div>
    </div>
</body>

</html>
