<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Figures</title>
    <link rel="stylesheet" href="../../dist/frost-ui.css" />
    <link rel="stylesheet" href="../assets/demo.css" />
    <script src="../../dist/frost-ui-bundle.js"></script>
    <script src="../assets/demo.js"></script>
</head>

<body>
    <div class="container">
        <h1>Figures</h1>

        <section class="mb-5">
            <header class="border-bottom pb-3 mb-4">
                <h2 class="h4 mb-1">Image and caption</h2>
                <p class="text-body-secondary mb-2">A figure keeps media and its explanatory caption together as one semantic unit.</p>
                <code>.figure</code> <code>.figure-img</code> <code>.figure-caption</code>
            </header>
            <div class="row g-4">
                <div class="col-md-6">
                    <figure class="figure mb-0">
                        <img class="figure-img img-fluid rounded-3" src="../assets/cabin.webp" width="720" height="480" alt="Cabin beside a misty alpine lake">
                        <figcaption class="figure-caption">A remote timber shelter beside an alpine lake at dawn.</figcaption>
                    </figure>
                </div>
                <div class="col-md-6">
                    <figure class="figure mb-0">
                        <img class="figure-img img-fluid rounded-3" src="../assets/coast.webp" width="720" height="480" alt="Hiker overlooking a coastal headland">
                        <figcaption class="figure-caption">The final lookout above a sheltered coastal route.</figcaption>
                    </figure>
                </div>
            </div>
        </section>

        <section class="mb-5 pb-5">
            <header class="border-bottom pb-3 mb-4">
                <h2 class="h4 mb-1">Caption alignment</h2>
                <p class="text-body-secondary mb-2">Text utilities adjust caption alignment without changing the figure component or its semantic structure.</p>
                <code>.text-end</code>
            </header>
            <figure class="figure mb-0">
                <img class="figure-img img-fluid rounded-3" src="../assets/canyon.webp" width="720" height="480" alt="Expedition vehicle overlooking a desert canyon" loading="lazy">
                <figcaption class="figure-caption text-end">A supported route through remote desert country.</figcaption>
            </figure>
        </section>
    </div>
</body>

</html>
