<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Figures</title>
    <link rel="stylesheet" href="../../dist/frost-ui.css" />
    <link rel="stylesheet" href="../assets/demo.css" />
    <script src="../../dist/frost-ui-bundle.js"></script>
    <script src="../assets/demo.js"></script>
</head>

<body>
    <div class="container">
        <h1>Figures</h1>

        <h4>Caption</h4>
        <p class="text-body-secondary">Figures keep related media and explanatory text together.</p>
        <div class="mb-4">
            <figure class="figure">
                <img class="figure-img img-fluid rounded" src="../assets/cabin.webp" width="560" height="373" alt="Cabin beside a misty alpine lake">
                <figcaption class="figure-caption">A remote timber shelter beside an alpine lake at dawn.</figcaption>
            </figure>
        </div>

        <h4>Aligned caption</h4>
        <p class="text-body-secondary">Text utilities can change caption alignment without altering the figure component.</p>
        <div class="mb-4">
            <figure class="figure">
                <img class="figure-img img-fluid rounded" src="../assets/canyon.webp" width="560" height="373" alt="Blue vehicle overlooking a desert canyon">
                <figcaption class="figure-caption text-end">A supported route through remote desert country.</figcaption>
            </figure>
        </div>
    </div>
</body>

</html>
