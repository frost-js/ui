<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Opacity</title>
    <link rel="stylesheet" href="../../dist/frost-ui.css" />
    <link rel="stylesheet" href="../assets/demo.css" />
    <script src="../../dist/frost-ui-bundle.js"></script>
    <script src="../assets/demo.js"></script>
</head>

<body>
    <div class="container">
        <h1>Opacity</h1>

        <section class="mb-5 pb-5">
            <header class="border-bottom pb-3 mb-4">
                <h2 class="h4 mb-1">Element opacity</h2>
                <p class="text-body-secondary mb-2">These utilities fade the complete element, including its background, content, border, and descendants.</p>
                <code>.opacity-{100|75|50|25|10|0}</code>
            </header>
            <div class="bg-body-secondary rounded-3 p-3">
                <div class="row row-cols-2 row-cols-md-3 g-3">
                    <div class="col"><div class="opacity-100 text-bg-primary rounded-3 p-4 h-100"><strong>100%</strong><small class="d-block">Fully opaque</small></div></div>
                    <div class="col"><div class="opacity-75 text-bg-primary rounded-3 p-4 h-100"><strong>75%</strong><small class="d-block">High</small></div></div>
                    <div class="col"><div class="opacity-50 text-bg-primary rounded-3 p-4 h-100"><strong>50%</strong><small class="d-block">Medium</small></div></div>
                    <div class="col"><div class="opacity-25 text-bg-primary rounded-3 p-4 h-100"><strong>25%</strong><small class="d-block">Low</small></div></div>
                    <div class="col"><div class="opacity-10 text-bg-primary rounded-3 p-4 h-100"><strong>10%</strong><small class="d-block">Very low</small></div></div>
                    <div class="col position-relative"><div class="opacity-0 text-bg-primary rounded-3 p-4 h-100">Invisible</div><strong class="position-absolute top-50 start-50 translate-middle">0%</strong></div>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
